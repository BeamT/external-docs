<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>
  <g stroke="#111" stroke-width="2.5" fill="#faf8f4"><rect x="200" y="20" width="240" height="320" rx="14"/></g>
  <rect x="216" y="36" width="208" height="40" rx="8" fill="#e6f5ef" stroke="#c2e6d7"/>
  <text x="230" y="61" font-size="12" font-weight="700" fill="#0f6e56">Schedule Active</text>
  <!-- day rows -->
  <g font-size="12" fill="#111">
    <rect x="216" y="88" width="208" height="34" rx="6" fill="#fff" stroke="#e5e2db"/><circle cx="232" cy="105" r="7" fill="#ff7a00"/><text x="250" y="109">Mon  9:00 AM – 11:00 PM</text>
    <rect x="216" y="128" width="208" height="34" rx="6" fill="#fff" stroke="#e5e2db"/><circle cx="232" cy="145" r="7" fill="#ff7a00"/><text x="250" y="149">Tue  9:00 AM – 11:00 PM</text>
    <rect x="216" y="168" width="208" height="34" rx="6" fill="#fff" stroke="#e5e2db"/><circle cx="232" cy="185" r="7" fill="#ff7a00"/><text x="250" y="189">Wed  9:00 AM – 11:00 PM</text>
  </g>
  <rect x="216" y="290" width="208" height="38" rx="8" fill="#ff7a00"/>
