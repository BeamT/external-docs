<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>
  <rect x="60" y="40" width="520" height="20" fill="#111"/>
  <text x="320" y="32" text-anchor="middle" font-size="13" fill="#55524d">Mount with clear line of sight to the rails</text>
  <!-- AP mount bracket -->
  <g stroke="#111" stroke-width="2.5" fill="#fff"><circle cx="320" cy="90" r="18"/></g>
  <line x1="320" y1="60" x2="320" y2="72" stroke="#111" stroke-width="3"/>
  <!-- good signal -->
  <g stroke="#1d9e75" stroke-width="2.5" fill="none">
    <path d="M340 100 q40 20 80 10"/><path d="M340 110 q50 30 100 24"/>
  </g>
  <path d="M120 150l10 10 18-22" stroke="#1d9e75" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="155" y="158" font-size="13" font-weight="700" fill="#1d9e75">Clear path to rails</text>
  <path d="M120 210l12 12M132 210l-12 12" stroke="#d64545" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="155" y="218" font-size="13" font-weight="700" fill="#d64545">Not behind metal or thick walls</text>
</svg>
