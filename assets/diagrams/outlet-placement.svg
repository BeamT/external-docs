<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>
  <!-- parklet outline -->
  <rect x="180" y="20" width="150" height="320" rx="6" fill="#f4f2ee" stroke="#b4b2a9" stroke-width="2"/>
  <!-- corner pillars (black squares) -->
  <g fill="#111">
    <rect x="184" y="24" width="14" height="14"/><rect x="312" y="24" width="14" height="14"/>
    <rect x="184" y="322" width="14" height="14"/><rect x="312" y="322" width="14" height="14"/>
    <rect x="184" y="170" width="14" height="14"/><rect x="312" y="170" width="14" height="14"/>
  </g>
  <!-- 4 rails (blue) -->
  <g fill="#378add">
    <rect x="248" y="40" width="14" height="60" rx="4"/>
    <rect x="248" y="120" width="14" height="60" rx="4"/>
    <rect x="248" y="200" width="14" height="60" rx="4"/>
    <rect x="248" y="280" width="14" height="60" rx="4"/>
  </g>
  <!-- cord exit (pink) at left/top of each rail -->
  <g fill="#d4537e">
    <circle cx="248" cy="44" r="5"/><circle cx="248" cy="124" r="5"/>
    <circle cx="248" cy="204" r="5"/><circle cx="248" cy="284" r="5"/>
  </g>
  <!-- outlets (green) to the left, dashed link -->
  <g>
    <rect x="206" y="38" width="14" height="14" fill="#1d9e75"/>
    <rect x="206" y="118" width="14" height="14" fill="#1d9e75"/>
    <rect x="206" y="198" width="14" height="14" fill="#1d9e75"/>
    <rect x="206" y="278" width="14" height="14" fill="#1d9e75"/>
  </g>
  <g stroke="#d64545" stroke-width="1.5" stroke-dasharray="4 3">
    <line x1="220" y1="45" x2="246" y2="45"/>
    <line x1="220" y1="125" x2="246" y2="125"/>
    <line x1="220" y1="205" x2="246" y2="205"/>
    <line x1="220" y1="285" x2="246" y2="285"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#55524d">
    <rect x="380" y="60" width="14" height="14" fill="#378add"/><text x="402" y="72">Rail</text>
    <rect x="380" y="88" width="14" height="14" fill="#1d9e75"/><text x="402" y="100">Outlet</text>
    <circle cx="387" cy="123" r="6" fill="#d4537e"/><text x="402" y="128">Cord exit</text>
    <rect x="380" y="144" width="14" height="14" fill="#111"/><text x="402" y="156">Pillar</text>
  </g>
  <text x="450" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Outlets on the left</text>
  <text x="450" y="230" text-anchor="middle" font-size="13" font-weight="700" fill="#111">(cord-exit) side of</text>
  <text x="450" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#111">each rail</text>
  <text x="450" y="278" text-anchor="middle" font-size="11" fill="#55524d">Clear of pillars, no</text>
  <text x="450" y="293" text-anchor="middle" font-size="11" fill="#55524d">extension cords</text>
</svg>
