<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340" font-family="Archivo, Arial, sans-serif">
  <rect width="780" height="340" fill="#ffffff"/>

  <!-- patio outline (22 ft × 6 ft, 30 px per ft), gap in the bottom edge for the entrance -->
  <g fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 240 H720 V60 H60 V240 H180"/>
  </g>

  <!-- a length on every line; the entrance side is split at the opening -->
  <g font-size="15" fill="#111" text-anchor="middle">
    <text x="390" y="46">22 ft</text>
    <text transform="translate(44 150) rotate(-90)">6 ft</text>
    <text transform="translate(744 150) rotate(-90)">6 ft</text>
    <text x="120" y="262">4 ft</text>
    <text x="480" y="262">16 ft</text>
  </g>

  <!-- bench along the back wall behind the 4-tops, marked built in -->
  <rect x="372" y="64" width="342" height="38" fill="none" stroke="#111" stroke-width="2"/>
  <text x="540" y="88" text-anchor="middle" font-size="13" fill="#111">Bench (built in)</text>

  <!-- two 2-tops (30×24 in) and two 4-tops (42×24 in) -->
  <g fill="none" stroke="#111" stroke-width="2">
    <rect x="97.5" y="120" width="75" height="60"/>
    <rect x="247.5" y="120" width="75" height="60"/>
    <rect x="397.5" y="120" width="105" height="60"/>
    <rect x="577.5" y="120" width="105" height="60"/>
  </g>

  <!-- seats: one mark per seat, on the side it sits; on the bench, one per person -->
  <g fill="#fff" stroke="#111" stroke-width="2">
    <circle cx="135" cy="100" r="7"/><circle cx="135" cy="200" r="7"/>
    <circle cx="285" cy="100" r="7"/><circle cx="285" cy="200" r="7"/>
    <circle cx="424" cy="83" r="7"/><circle cx="476" cy="83" r="7"/>
    <circle cx="424" cy="200" r="7"/><circle cx="476" cy="200" r="7"/>
    <circle cx="604" cy="83" r="7"/><circle cx="656" cy="83" r="7"/>
    <circle cx="604" cy="200" r="7"/><circle cx="656" cy="200" r="7"/>
  </g>

  <!-- table sizes -->
  <g font-size="12" fill="#111" text-anchor="middle">
    <text x="135" y="154">30×24</text>
    <text x="285" y="154">30×24</text>
    <text x="450" y="154">42×24</text>
    <text x="630" y="154">42×24</text>
  </g>

  <!-- entrance -->
  <g stroke="#111" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M210 296 V252"/>
    <path d="M201 262 L210 251 L219 262"/>
  </g>
  <text x="210" y="318" text-anchor="middle" font-size="15" fill="#111">Entrance</text>

</svg>
