<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="280" fill="#ffffff"/>
  <!-- rail switch -->
  <g stroke="#111" stroke-width="2.5" fill="#fff"><rect x="80" y="90" width="46" height="34" rx="6"/></g>
  <rect x="102" y="94" width="16" height="26" rx="3" fill="#1d9e75"/>
  <text x="103" y="150" text-anchor="middle" font-size="12" fill="#0f6e56" font-weight="700">Switch ON</text>
  <!-- seated plug -->
  <rect x="220" y="88" width="200" height="20" rx="10" fill="#111"/>
  <circle cx="320" cy="98" r="8" fill="none" stroke="#111" stroke-width="3"/>
  <text x="320" y="140" text-anchor="middle" font-size="12" fill="#55524d">Fully seated in plug point</text>
  <!-- LED -->
  <circle cx="500" cy="98" r="10" fill="#1d9e75"/>
  <text x="500" y="130" text-anchor="middle" font-size="12" fill="#0f6e56" font-weight="700">LEDs lit</text>
  <text x="320" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Check power and seating first</text>
</svg>
