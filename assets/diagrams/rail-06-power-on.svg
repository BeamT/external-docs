<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>
  <!-- rail with switch at end -->
  <rect x="120" y="120" width="400" height="24" rx="12" fill="#111"/>
  <!-- switch -->
  <g stroke="#111" stroke-width="2.5" fill="#fff"><rect x="486" y="118" width="40" height="28" rx="5"/></g>
  <rect x="506" y="122" width="14" height="20" rx="3" fill="#1d9e75"/>
  <text x="506" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#1d9e75">Switch ON</text>

  <!-- slack cable secured with zip ties -->
  <path d="M120 138 C100 150 100 190 150 200 L360 200" stroke="#111" stroke-width="3" fill="none"/>
  <g stroke="#111" stroke-width="2" fill="none">
    <rect x="210" y="194" width="8" height="12" rx="2"/>
    <rect x="290" y="194" width="8" height="12" rx="2"/>
  </g>
  <text x="255" y="230" text-anchor="middle" font-size="12" fill="#55524d">Secure slack with zip ties or clamps</text>

  <rect x="150" y="270" width="340" height="40" rx="8" fill="#fff3e6" stroke="#ff7a00"/>
  <text x="320" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#b5710a">No cable should hang below the bottom of the rail</text>
</svg>
