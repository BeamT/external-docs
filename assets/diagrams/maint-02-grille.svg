<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="260" fill="#ffffff"/>
  <ellipse cx="240" cy="120" rx="70" ry="70" fill="#f4f2ee" stroke="#111" stroke-width="2.5"/>
  <g stroke="#111" stroke-width="1.5" opacity="0.5"><line x1="200" y1="90" x2="200" y2="150"/><line x1="240" y1="80" x2="240" y2="160"/><line x1="280" y1="90" x2="280" y2="150"/></g>
  <!-- canned air -->
  <g stroke="#111" stroke-width="2.5" fill="#fff"><rect x="380" y="95" width="34" height="60" rx="6"/></g>
  <path d="M380 120 l-40 5" stroke="#378add" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M6 0l-6 3 6 3z" fill="#378add"/></marker></defs>
