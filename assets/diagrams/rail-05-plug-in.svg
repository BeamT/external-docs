<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>
  <!-- rail -->
  <rect x="120" y="90" width="400" height="22" rx="11" fill="#111"/>
  <text x="320" y="80" text-anchor="middle" font-size="13" fill="#55524d">Rail (8 ft built-in cable)</text>
  <!-- cord exits left, routes to outlet -->
  <path d="M120 108 C90 120 90 180 130 195 L200 195" stroke="#111" stroke-width="3" fill="none"/>
  <!-- plug -->
  <g fill="#111"><rect x="196" y="188" width="20" height="14" rx="2"/></g>
  <!-- outlet aligned left -->
  <g stroke="#111" stroke-width="2.5" fill="#fff"><rect x="220" y="178" width="46" height="34" rx="5"/></g>
  <circle cx="243" cy="188" r="2.5" fill="#111"/><circle cx="243" cy="202" r="2.5" fill="#111"/>
  <text x="243" y="235" text-anchor="middle" font-size="12" fill="#55524d">GFCI outlet, own circuit</text>

  <!-- good: aligned to left / cord-exit side -->
  <g><path d="M470 150l7 7 14-16" stroke="#1d9e75" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="500" y="158" font-size="13" font-weight="700" fill="#1d9e75">Outlet in line with the left</text>
  <text x="500" y="176" font-size="13" font-weight="700" fill="#1d9e75">(cord-exit) side of the rail</text>

  <!-- bad: extension cord -->
  <g><path d="M470 250l14 14M484 250l-14 14" stroke="#d64545" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <text x="500" y="255" font-size="13" font-weight="700" fill="#d64545">No extension cords or</text>
  <text x="500" y="273" font-size="13" font-weight="700" fill="#d64545">shared circuits</text>

  <text x="270" y="320" text-anchor="middle" font-size="12" fill="#55524d">Route cable along rail / hardware, out of sight · 12AWG, 20A</text>
</svg>
