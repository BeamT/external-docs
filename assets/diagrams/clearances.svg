<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Archivo, Arial, sans-serif">
  <rect width="720" height="420" fill="#ffffff"/>
  <!-- ceiling -->
  <rect x="60" y="60" width="600" height="16" fill="#111"/>
  <text x="360" y="50" text-anchor="middle" font-size="13" fill="#55524d">Ceiling</text>
  <!-- drop pipes -->
  <line x1="230" y1="76" x2="230" y2="150" stroke="#111" stroke-width="3"/>
  <line x1="490" y1="76" x2="490" y2="150" stroke="#111" stroke-width="3"/>
  <!-- rail -->
  <rect x="150" y="150" width="420" height="20" rx="10" fill="#111"/>
  <!-- heaters -->
  <g fill="none" stroke="#111" stroke-width="2.5">
    <ellipse cx="290" cy="205" rx="34" ry="16"/>
    <ellipse cx="430" cy="205" rx="34" ry="16"/>
  </g>
  <line x1="290" y1="170" x2="290" y2="189" stroke="#111" stroke-width="3"/>
  <line x1="430" y1="170" x2="430" y2="189" stroke="#111" stroke-width="3"/>
  <!-- floor -->
  <rect x="60" y="392" width="600" height="10" fill="#111"/>
  <text x="360" y="415" text-anchor="middle" font-size="13" fill="#55524d">Floor</text>
  <!-- walls -->
  <rect x="60" y="60" width="10" height="342" fill="#111"/>
  <rect x="650" y="60" width="10" height="342" fill="#111"/>

  <!-- DIM A: ceiling to rail (0 in) -->
  <g stroke="#ff7a00" stroke-width="2">
    <line x1="360" y1="76" x2="360" y2="150"/>
  </g>
  <rect x="330" y="100" width="60" height="24" rx="6" fill="#fff3e6" stroke="#ff7a00"/>
  <text x="360" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#b5710a">0 in</text>

  <!-- DIM D: floor to bottom of heater (78 in) -->
  <g stroke="#ff7a00" stroke-width="2">
    <line x1="560" y1="221" x2="560" y2="392"/>
    <path d="M555 226l5-6 5 6M555 386l5 6 5-6" fill="none"/>
  </g>
  <rect x="530" y="295" width="66" height="24" rx="6" fill="#fff3e6" stroke="#ff7a00"/>
  <text x="563" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#b5710a">84 in</text>

  <!-- DIM B: wall to rail (20 in) -->
  <g stroke="#ff7a00" stroke-width="2">
    <line x1="70" y1="160" x2="150" y2="160"/>
    <path d="M75 155l-6 5 6 5M145 155l6 5-6 5" fill="none"/>
  </g>
  <rect x="78" y="128" width="66" height="24" rx="6" fill="#fff3e6" stroke="#ff7a00"/>
  <text x="111" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#b5710a">20 in</text>

  <!-- DIM C: objects under heater (36 in) -->
  <rect x="180" y="330" width="220" height="40" rx="6" fill="none" stroke="#55524d" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="290" y="355" text-anchor="middle" font-size="12" fill="#55524d">Objects under heater</text>
  <g stroke="#ff7a00" stroke-width="2">
    <line x1="290" y1="221" x2="290" y2="330"/>
  </g>
  <rect x="257" y="262" width="66" height="24" rx="6" fill="#fff3e6" stroke="#ff7a00"/>
  <text x="290" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#b5710a">36 in</text>
</svg>
