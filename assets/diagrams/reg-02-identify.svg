<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="340" fill="#ffffff"/>
  <!-- phone with Identify button -->
  <g stroke="#111" stroke-width="2.5" fill="#faf8f4"><rect x="60" y="40" width="200" height="240" rx="14"/></g>
  <rect x="90" y="150" width="140" height="40" rx="8" fill="#ff7a00"/>
  <text x="160" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Identify</text>
  <!-- signal to heater -->
  <path d="M270 160 h60" stroke="#ff7a00" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#ff7a00"/></marker></defs>
  <!-- heater flashing -->
  <g transform="translate(400,110)">
    <ellipse cx="60" cy="50" rx="46" ry="46" fill="#f4f2ee" stroke="#111" stroke-width="2.5"/>
    <ellipse cx="60" cy="50" rx="26" ry="26" fill="none" stroke="#111" stroke-width="2"/>
    <g stroke="#1d9e75" stroke-width="3"><line x1="120" y1="20" x2="134" y2="14"/><line x1="124" y1="50" x2="140" y2="50"/><line x1="120" y1="80" x2="134" y2="86"/></g>
  </g>
  <text x="320" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Identify confirms the physical unit</text>
</svg>
