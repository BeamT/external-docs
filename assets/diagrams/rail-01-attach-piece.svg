<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>
  <!-- exploded assembly, top to bottom -->
  <!-- two screws -->
  <g stroke="#111" stroke-width="2.5" fill="none">
    <line x1="250" y1="40" x2="250" y2="95"/>
    <line x1="330" y1="40" x2="330" y2="95"/>
  </g>
  <g fill="#111">
    <path d="M240 34h20l-4 8h-12z"/>
    <path d="M320 34h20l-4 8h-12z"/>
  </g>
  <text x="360" y="60" font-size="13" fill="#55524d">1/4-20 x 1.125"</text>
  <text x="360" y="78" font-size="13" fill="#55524d">flat head screws (x2)</text>

  <!-- parallel standoff block -->
  <g stroke="#111" stroke-width="2.5" fill="#fff">
    <ellipse cx="290" cy="150" rx="86" ry="34"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2">
    <circle cx="250" cy="150" r="10"/>
    <circle cx="330" cy="150" r="10"/>
    <ellipse cx="290" cy="150" rx="20" ry="13"/>
  </g>
  <text x="392" y="150" font-size="13" fill="#55524d">Parallel standoff</text>
  <text x="392" y="168" font-size="13" fill="#55524d">block</text>

  <!-- set screws entering the side -->
  <g stroke="#ff7a00" stroke-width="2.5">
    <line x1="150" y1="150" x2="200" y2="150"/>
    <path d="M156 145l-6 5 6 5" fill="none"/>
  </g>
  <text x="60" y="140" font-size="13" fill="#b5710a">2 set screws</text>
  <text x="60" y="158" font-size="13" fill="#b5710a">(1/4-20 x 5/16")</text>

  <!-- double T-nut at bottom -->
  <g stroke="#111" stroke-width="2.5" fill="#fff">
    <rect x="220" y="240" width="140" height="42" rx="6"/>
  </g>
  <g fill="none" stroke="#111" stroke-width="2">
    <circle cx="250" cy="261" r="8"/>
    <circle cx="330" cy="261" r="8"/>
  </g>
  <text x="392" y="266" font-size="13" fill="#55524d">Double T-nut</text>

  <!-- assembly arrows -->
  <g stroke="#111" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="290" y1="100" x2="290" y2="112" marker-end="url(#a)"/>
    <line x1="290" y1="190" x2="290" y2="232" marker-end="url(#a)"/>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M1 1l3 5 3-5" fill="none" stroke="#111" stroke-width="1.5"/></marker></defs>

  <text x="320" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Assemble loosely — leave room to adjust</text>
</svg>
