<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="280" fill="#ffffff"/>
  <!-- re-seat plug -->
  <rect x="120" y="110" width="180" height="20" rx="10" fill="#111"/>
  <g><rect x="196" y="106" width="28" height="28" rx="4" fill="#fff" stroke="#111" stroke-width="2.5"/></g>
  <path d="M210 90 v10 M210 140 v10" stroke="#ff7a00" stroke-width="3"/>
