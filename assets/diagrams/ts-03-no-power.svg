<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="280" fill="#ffffff"/>
  <!-- outlet + tester -->
  <g stroke="#111" stroke-width="2.5" fill="#fff"><rect x="120" y="90" width="60" height="80" rx="6"/></g>
  <circle cx="150" cy="115" r="4" fill="#111"/><circle cx="150" cy="145" r="4" fill="#111"/>
  <g stroke="#111" stroke-width="2.5" fill="#fdf3e0"><rect x="210" y="100" width="30" height="70" rx="6"/></g>
  <circle cx="225" cy="115" r="6" fill="#eda100"/>
  <text x="225" y="190" text-anchor="middle" font-size="12" fill="#55524d">Non-contact tester</text>
  <text x="420" y="120" font-size="13" font-weight="700" fill="#111">Test on a known-good</text>
  <text x="420" y="140" font-size="13" font-weight="700" fill="#111">circuit before blaming</text>
  <text x="420" y="160" font-size="13" font-weight="700" fill="#111">the heater</text>
  <text x="320" y="245" text-anchor="middle" font-size="12" fill="#55524d">Extension cords / shared circuits are the usual cause of tripping</text>
</svg>
