<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>
  <rect x="100" y="140" width="360" height="24" rx="12" fill="#111"/>
  <!-- end cap back on -->
  <g stroke="#111" stroke-width="2.5" fill="#fff"><rect x="452" y="136" width="18" height="32" rx="3"/></g>
  <!-- bumper -->
  <g stroke="#111" stroke-width="2.5" fill="#fff"><rect x="420" y="136" width="30" height="32" rx="4"/></g>
  <g fill="#ff7a00"><circle cx="435" cy="152" r="3"/></g>
  <text x="435" y="120" text-anchor="middle" font-size="12" fill="#55524d">Refit cap + screws,</text>
  <text x="435" y="107" text-anchor="middle" font-size="12" fill="#55524d">slide bumper over</text>
  <!-- warn: hold end plate + don't overtighten -->
  <g><path d="M120 220l12 12M132 220l-12 12" stroke="#d64545" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <text x="150" y="225" font-size="13" font-weight="700" fill="#d64545">Don't overtighten the bumper set screw</text>
  <text x="150" y="245" font-size="12" fill="#55524d">Hold the end plate with one hand while driving screws</text>
  <text x="320" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Close up the rail</text>
</svg>
