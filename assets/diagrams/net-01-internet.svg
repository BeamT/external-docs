<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="300" fill="#ffffff"/>
  <!-- networking box -->
  <g stroke="#111" stroke-width="2.5" fill="#f4f2ee"><rect x="240" y="90" width="160" height="90" rx="10"/></g>
  <text x="320" y="205" text-anchor="middle" font-size="13" fill="#55524d">Focal networking box</text>
  <!-- WAN port -->
  <rect x="250" y="150" width="26" height="18" rx="2" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="263" y="142" text-anchor="middle" font-size="11" fill="#b5710a" font-weight="700">WAN</text>
  <!-- internet cable in -->
  <path d="M120 159 h128" stroke="#378add" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#378add"/></marker></defs>
  <text x="120" y="145" font-size="13" font-weight="700" fill="#185fa5">Site internet</text>
  <text x="320" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#111">Plug internet into the WAN port</text>
</svg>
