<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Archivo, Arial, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="160" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Centered — heats the chest</text>
  <text x="480" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#111">Off-center — angle toward guest</text>

  <!-- CENTERED side view -->
  <g transform="translate(40,50)">
    <line x1="0" y1="0" x2="240" y2="0" stroke="#111" stroke-width="3"/>
    <rect x="112" y="0" width="16" height="20" fill="#111"/>
    <!-- beams -->
    <path d="M120 20 L70 70 M120 20 L170 70" stroke="#ff7a00" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
    <!-- guests -->
    <circle cx="55" cy="95" r="12" fill="none" stroke="#111" stroke-width="2"/>
    <circle cx="185" cy="95" r="12" fill="none" stroke="#111" stroke-width="2"/>
    <line x1="55" y1="107" x2="55" y2="150" stroke="#111" stroke-width="2"/>
    <line x1="185" y1="107" x2="185" y2="150" stroke="#111" stroke-width="2"/>
    <rect x="95" y="120" width="50" height="6" fill="#111"/>
    <text x="120" y="175" text-anchor="middle" font-size="11" fill="#55524d">Side view</text>
  </g>
  <!-- CENTERED top view -->
  <g transform="translate(40,240)">
    <rect x="60" y="0" width="120" height="70" rx="12" fill="#fde9c9"/>
    <rect x="116" y="-6" width="8" height="82" fill="#378add"/>
    <circle cx="110" cy="22" r="6" fill="#d85a30"/><circle cx="130" cy="22" r="6" fill="#d85a30"/>
    <circle cx="110" cy="48" r="6" fill="#d85a30"/><circle cx="130" cy="48" r="6" fill="#d85a30"/>
    <text x="120" y="95" text-anchor="middle" font-size="11" fill="#55524d">Top view</text>
  </g>

  <!-- OFF-CENTER side view -->
  <g transform="translate(360,50)">
    <line x1="0" y1="0" x2="240" y2="0" stroke="#111" stroke-width="3"/>
    <rect x="60" y="0" width="16" height="20" fill="#111"/>
    <path d="M68 20 L60 70 M68 20 L150 70" stroke="#ff7a00" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
    <circle cx="55" cy="95" r="12" fill="none" stroke="#111" stroke-width="2"/>
    <circle cx="165" cy="95" r="12" fill="none" stroke="#111" stroke-width="2"/>
    <line x1="55" y1="107" x2="55" y2="150" stroke="#111" stroke-width="2"/>
    <line x1="165" y1="107" x2="165" y2="150" stroke="#111" stroke-width="2"/>
    <rect x="85" y="120" width="50" height="6" fill="#111"/>
    <text x="120" y="175" text-anchor="middle" font-size="11" fill="#55524d">Side view</text>
  </g>
  <!-- OFF-CENTER top view -->
  <g transform="translate(360,240)">
    <rect x="60" y="0" width="120" height="70" rx="12" fill="#fde9c9"/>
    <rect x="92" y="-6" width="8" height="82" fill="#378add"/>
    <circle cx="86" cy="22" r="6" fill="#d85a30"/><circle cx="106" cy="22" r="6" fill="#d85a30"/>
    <circle cx="86" cy="48" r="6" fill="#d85a30"/><circle cx="106" cy="48" r="6" fill="#d85a30"/>
    <text x="120" y="95" text-anchor="middle" font-size="11" fill="#55524d">Top view</text>
  </g>
</svg>
