<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focal Troubleshooting</title>
<style>
:root {
  --bg: #FAFAF8;
  --card: #FFFFFF;
  --border: #E2E0D8;
  --ink: #2C2C2A;
  --ink-soft: #73726C;
  --ink-faint: #B4B2A9;
  --focal: #E8653A;
  --focal-light: #FEF3EF;
  --green: #0F6E56;
  --green-bg: #E1F5EE;
  --green-border: #9FE1CB;
  --amber: #854F0B;
  --amber-bg: #FAEEDA;
  --amber-border: #FAC775;
  --blue: #185FA5;
  --blue-bg: #E6F1FB;
  --blue-border: #85B7EB;
  --purple: #534AB7;
  --purple-bg: #F4F3FF;
  --purple-border: #CECBF6;
  --radius: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  min-height: 100vh;
}

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 32px 20px 100px;
}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--focal);
  text-decoration: none;
  margin-bottom: 4px;
}

.logo-text { text-decoration: none; }
.logo:hover .logo-text { text-decoration: underline; }

.logo-arrow {
  display: inline-block;
  transition: transform 0.15s;
}

.logo:hover .logo-arrow { transform: translateX(-3px); }

h1 {
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 6px;
}

.subtitle {
  font-size: 14px;
  color: var(--ink-soft);
  margin-bottom: 32px;
}

/* Completed steps */
.history {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-bottom: 0;
}

.history-step {
  position: relative;
  padding: 12px 44px 12px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-bottom: none;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-tap-highlight-color: rgba(0,0,0,0.04);
}

.history-step:first-child {
  border-radius: var(--radius) var(--radius) 0 0;
}

.history-step:hover {
  background: #F5F4F0;
}

.history-step:active {
  background: #EEEDEA;
}

.history-step .step-num {
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 2px;
}

.history-step .step-q {
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 4px;
}

.history-step .step-a {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
}

.history-step .step-a::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--focal);
  flex-shrink: 0;
}

.history-step .change-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-soft);
  font-size: 13px;
  transition: all 0.15s;
}

.history-step:hover .change-icon,
.history-step:active .change-icon {
  border-color: var(--focal);
  color: var(--focal);
}

/* Active question */
.active-step {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.history + .active-step,
.history-step + .active-step-wrap .active-step {
  border-radius: 0 0 var(--radius) var(--radius);
}

.has-history .active-step {
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
}

.active-step .step-num {
  font-size: 11px;
  font-weight: 600;
  color: var(--focal);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 6px;
}

.active-step .instruction {
  background: #FEF7F4;
  border-left: 3px solid var(--focal);
  border-radius: 0 8px 8px 0;
  padding: 14px 16px;
  font-size: 14px;
  color: var(--ink);
  margin-bottom: 16px;
  line-height: 1.5;
}

.active-step .instruction .inst-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--focal);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #F0DDD5;
}

.active-step .instruction .inst-link:hover { text-decoration: underline; }

.active-step .instruction .inst-link svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.active-step .question-text {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 16px;
  line-height: 1.35;
}

.active-step .options {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.opt-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 16px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  font-weight: 400;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  font-family: inherit;
  line-height: 1.4;
  -webkit-tap-highlight-color: rgba(0,0,0,0.04);
  min-height: 52px;
}

.opt-btn:hover {
  border-color: var(--focal);
  background: var(--focal-light);
}

.opt-btn:active {
  border-color: var(--focal);
  background: #FDEAE2;
}

.opt-btn::before {
  content: '';
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  flex-shrink: 0;
  transition: all 0.15s;
}

.opt-btn:hover::before {
  border-color: var(--focal);
}

/* Endpoints */
.endpoint {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 20px;
  text-align: center;
}

.has-history .endpoint {
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
}

.endpoint-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 12px;
  font-size: 22px;
}

.endpoint-icon.resolved { background: var(--green-bg); }
.endpoint-icon.support { background: var(--amber-bg); }

.endpoint h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 6px;
}

.endpoint p {
  font-size: 14px;
  color: var(--ink-soft);
  margin-bottom: 20px;
  max-width: 360px;
  margin-left: auto;
  margin-right: auto;
}

.email-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 10px 20px;
  background: var(--focal);
  color: #FFF;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: opacity 0.15s;
  text-decoration: none;
}

.email-btn:hover { opacity: 0.9; }

.email-btn.disabled {
  opacity: 0.45;
  cursor: not-allowed;
  pointer-events: none;
}

.textarea-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  max-width: 360px;
  margin: 0 auto 8px;
  text-align: left;
}

.issue-textarea {
  display: block;
  width: 100%;
  max-width: 360px;
  min-height: 72px;
  margin: 0 auto 16px;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  resize: vertical;
}

.issue-textarea:focus {
  outline: none;
  border-color: var(--focal);
}

.heater-id-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 360px;
  margin: 0 auto 10px;
  position: relative;
}

.remove-heater-btn {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--ink-soft);
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.remove-heater-btn:hover {
  border-color: var(--focal);
  color: var(--focal);
}

.add-heater-btn {
  display: block;
  width: 100%;
  max-width: 360px;
  margin: 4px auto 16px;
  padding: 10px;
  background: none;
  border: 1.5px dashed var(--border);
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 500;
  font-family: inherit;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s;
}

.add-heater-btn:hover {
  border-color: var(--focal);
  color: var(--focal);
}

.heater-id-input {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
}

.heater-id-input:focus {
  outline: none;
  border-color: var(--focal);
}

.scan-qr-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
}

.scan-qr-btn:hover {
  border-color: var(--focal);
  color: var(--focal);
}

.qr-scanner-dialog {
  border: none;
  border-radius: var(--radius);
  padding: 0;
  max-width: 420px;
  width: calc(100% - 40px);
  max-height: calc(100% - 40px);
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  position: fixed;
  inset: 0;
  margin: auto;
}

.qr-scanner-dialog::backdrop {
  background: rgba(0,0,0,0.65);
}

.qr-scanner-box {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 20px;
}

.qr-scanner-head {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qr-scanner-head h3 {
  font-size: 16px;
  font-weight: 600;
  text-align: center;
}

.qr-scanner-close {
  position: absolute;
  top: 50%;
  right: 0;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 50%;
  font-size: 18px;
  line-height: 1;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s;
}

.qr-scanner-close:hover {
  background: var(--focal-light);
  border-color: var(--focal);
  color: var(--focal);
}

.qr-scanner-video {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  object-position: center;
  border-radius: 8px;
  background: #000;
}

.qr-scanner-status {
  font-size: 13px;
  color: var(--ink-soft);
  text-align: center;
}

.send-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  max-width: 360px;
  margin: 0 auto;
}

.send-plain {
  max-width: 360px;
  margin: 0 auto;
}

.send-reminders {
  list-style: none;
  text-align: left;
  margin-bottom: 16px;
  font-size: 14px;
  color: var(--ink);
}

.send-reminders li {
  position: relative;
  padding: 6px 0 6px 26px;
  line-height: 1.4;
  font-weight: 500;
}

.send-reminders li + li {
  border-top: 1px solid var(--border);
  margin-top: 2px;
}

.send-reminders li::before {
  content: '\2713';
  position: absolute;
  left: 0;
  top: 6px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--amber-bg);
  border: 1px solid var(--amber-border);
  color: var(--amber);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fallback-link {
  margin-top: 10px;
  font-size: 13px;
  color: var(--ink-soft);
}

.fallback-link a {
  color: var(--focal);
  text-decoration: none;
}

.fallback-link a:hover { text-decoration: underline; }

.start-over-btn {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 16px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  color: var(--ink-soft);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.start-over-btn:hover {
  border-color: var(--ink-soft);
  color: var(--ink);
}

.another-link {
  margin-top: 12px;
  font-size: 13px;
  color: var(--ink-soft);
}

.another-link a {
  color: var(--focal);
  text-decoration: none;
}

.another-link a:hover { text-decoration: underline; }

.resolved-help {
  margin-top: 14px;
}

/* Fade in animation */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in {
  animation: fadeUp 0.25s ease-out;
}
</style>
</head>
<body>

<div class="wrap">
  <a class="logo" href="{{ site.baseurl }}/"><span class="logo-arrow" aria-hidden="true">&larr;</span> <span class="logo-text">Focal Support</span></a>
  <h1>Troubleshooting</h1>
  <p class="subtitle">We'll walk you through it.</p>
  <div id="app"></div>
</div>

<dialog id="qr-scanner-dialog" class="qr-scanner-dialog">
  <div class="qr-scanner-box">
    <div class="qr-scanner-head">
      <h3>Scan QR Code</h3>
      <button type="button" class="qr-scanner-close" onclick="document.getElementById('qr-scanner-dialog').close()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="3" x2="13" y2="13"></line>
          <line x1="13" y1="3" x2="3" y2="13"></line>
        </svg>
      </button>
    </div>
    <video id="qr-scanner-video" class="qr-scanner-video" playsinline muted></video>
    <p id="qr-scanner-status" class="qr-scanner-status">Point the camera at the QR code.</p>
  </div>
</dialog>

<script>
// ============================================================================
// TREE: the troubleshooting decision graph.
//
// Each key is a "node" the user can be standing on. A node is either:
//   - a question node: { question, options: [{ label, next, ... }] }
//     `next` is either a nodeId string, or a function (ctx) => nodeId when
//     the destination depends on context recovered from earlier answers —
//     ctx.scope (all vs. some heaters, see getScope()) or ctx.fallbackKind
//     (see heat_fallback below and getFallbackKind()).
//   - an endpoint node: { type: 'resolved' | 'support' | 'electrician', ... }
//     endpoints render a final screen instead of another question.
//
// A few nodes are shared "checkpoint" questions reused from multiple places
// in the tree (see HEAT_FALLBACK and END_SUPPORT below) — they're written
// once and parameterized via a value stashed on the path, the same pattern
// getScope() uses for the all-vs-some answer.
// ============================================================================
const TREE = {
  start: {
    question: "What's going on?",
    options: [
      { label: "Heaters offline or not responding", next: 'scope' },
      { label: "Heater won't slide on the rail", next: 'move_action' },
      { label: "Heater is damaged", next: 'damaged_end' },
      { label: "Something else", next: 'end_support_generic' },
    ]
  },

  // === CAN'T CONTROL ===
  scope: {
    question: "Are all heaters affected, or some?",
    options: [
      { label: "All heaters", next: 'lights_check' },
      { label: "Some heaters", next: 'lights_check' },
    ]
  },

  lights_check: {
    question: "Are the heater's orange and purple LEDs on?",
    options: [
      { label: "Yes, the LEDs are on", next: 'control_method' },
      { label: "No, the LEDs are off", next: (ctx) => ctx.scope === 'all' ? 'check_breaker' : 'reseat' },
    ]
  },

  control_method: {
    question: "How are you trying to control it?",
    options: [
      { label: "App or QR code", next: (ctx) => ctx.scope === 'all' ? 'networking' : 'pull_string_check_some_app' },
      { label: "Pull string", next: 'pull_test' },
    ]
  },

  pull_string_check_some_app: {
    instruction: "Pull the string on the affected heater(s) all the way down until the orange and purple LEDs turn off then release it. Wait 30 seconds.",
    question: "Did that resolve the issue?",
    options: [
      { label: "Yes, I'm all set", next: 'end_resolved' },
      { label: "No, I still need help", next: 'heat_fallback', fallbackKind: 'some_app' },
    ]
  },

  networking: {
    instruction: "Locate the Focal networking box, unplug it from power then plug it back in. If it's located next to your restaurant's router, confirm that it's plugged into your router and the internet is working.",

    question: "Can you control the heaters now?",
    options: [
      { label: "Yes, I can control them", next: 'end_resolved', resolvedNoUnitPhoto: true },
      { label: "No, I still can't control them", next: 'end_support_networking' },
    ]
  },

  // -- Pull string path --
  pull_test: {
    instruction: "Give the pull string a **short** pull and watch the LEDs.",
    link: { label: "How the pull string works", url: "{{ site.baseurl }}/individual-heater-control/#at-the-heater-the-pull-string" },
    question: "What happens?",
    options: [
      { label: "Yellow LEDs are flashing", next: 'schedule_check_pull' },
      { label: "White LEDs changed", next: 'end_pull_working' },
      { label: "Nothing happened", next: 'heat_fallback', fallbackKind: 'pull_dead' },
      { label: "Something else / not sure", next: 'heat_fallback', fallbackKind: 'pull_other' },
    ]
  },

  schedule_check_pull: {
    instruction: "Schedule Mode is active and heaters won't respond outside of scheduled hours.",
    link: { label: "Open System Setup Guide", url: "{{ site.baseurl }}/system-setup-control/" },
    question: "Did that help?",
    options: [
      { label: "Yes, I'm all set", next: 'end_resolved' },
      { label: "No, I still need help", next: 'heat_fallback', fallbackKind: 'pull_schedule' },
    ]
  },

  end_pull_working: {
    type: 'resolved',
    heading: "The pull string is working",
    message: "The white LEDs show the current heat level. Each pull cycles to the next level."
  },

  // === NO POWER (A2) ===
  reseat: {
    instruction: "Re-seat the heater: pull the string all the way down, slide the heater off the slot, let go of the string and slide it back until it locks.",
    question: "Did the orange and purple LEDs come on?",
    options: [
      { label: "Yes, the LEDs came on", next: 'power_restored_control_check' },
      { label: "No, the LEDs are still off", next: 'check_rail' },
    ]
  },

  check_rail: {
    question: "Look at other heaters on the same rail. Are their orange and purple LEDs on?",
    options: [
      { label: "Yes, the others are on", next: 'heat_fallback', fallbackKind: 'rail_isolated' },
      { label: "No, the others are off too", next: 'check_breaker' },
    ]
  },

  check_breaker: {
    instruction: "Check the rail's power switch and circuit breaker.",
    question: "Did the orange and purple LEDs come back on?",
    options: [
      { label: "Yes, the LEDs came back on", next: 'power_restored_control_check' },
      { label: "No, the LEDs are still off", next: 'test_outlet' },
    ]
  },

  power_restored_control_check: {
    question: "Now that the LEDs are on, can you control the heaters?",
    options: [
      { label: "Yes, I can control them", next: 'end_resolved' },
      { label: "No, I still can't control them", next: 'control_method' },
    ]
  },

  test_outlet: {
    instruction: "Test the outlet with another electrical device.",
    question: "Does the outlet provide power?",
    options: [
      { label: "Yes, the outlet provides power", next: 'end_support_no_power' },
      { label: "No, the outlet has no power", next: 'end_electrician' },
    ]
  },

  // === CAN'T SLIDE ON RAIL ===
  move_action: {
    instruction: "Pull the string all the way down before trying to slide the heater along the rail. If it's still difficult to slide, use your other hand to grip the middle of the heater for extra leverage.",
    link: { label: "How to slide a heater on the rail", url: "{{ site.baseurl }}/individual-heater-control/#at-the-heater-the-pull-string" },
    question: "Can you slide it now?",
    options: [
      { label: "Yes, I can slide it", next: 'end_resolved' },
      { label: "No, it still won't slide", next: 'heat_fallback_cant_move' },
    ]
  },

  // === DAMAGED ===
  // Distinct from the shared support endpoints below: this is the one path
  // with a safety instruction (don't keep running a damaged heater), and it
  // skips the heat-fallback question entirely (see END_SUPPORT_TARGETS note).
  damaged_end: {
    type: 'support',
    code: 'damaged',
    heading: "Secure the heater and contact support",
    safetyStep: "Move the heater off the slot and secure any loose parts so nothing falls. Don't run a damaged heater."
  },

  // --- Shared "heat fallback" checkpoint ---
  // Five different single-unit trouble paths (app/QR failed, pull string
  // dead, pull string did something unexpected, schedule-mode ruled out,
  // one heater isolated on an otherwise-fine rail) all used to ask this
  // exact question as five copy-pasted nodes differing only in where they
  // went next. They're unified into one node here; the *caller's* option
  // stamps a `fallbackKind` (see e.g. pull_test above) recording which of
  // those five situations we're in, and heat_fallback's `next` looks that
  // kind up in END_SUPPORT_TARGETS via getFallbackKind() (scans `path` the
  // same way getScope() recovers the earlier all-vs-some answer).
  // Both answers currently lead to the same support endpoint either way —
  // this only affects the "_has_heat"/"_no_heat" suffix on the issue code
  // (see getHeatFallbackSuffix()), which support uses for triage urgency.
  heat_fallback: {
    question: "Can you still get heat another way, app/QR or pull string?",
    options: [
      { label: "Yes, at least one way still works", next: (ctx) => END_SUPPORT_TARGETS[ctx.fallbackKind] },
      { label: "No, it won't heat at all", next: (ctx) => END_SUPPORT_TARGETS[ctx.fallbackKind] },
    ]
  },

  heat_fallback_cant_move: {
    question: "Does it still provide heat?",
    options: [
      { label: "Yes, it still provides heat", next: 'end_support_cant_move' },
      { label: "No, it won't heat at all", next: 'end_support_cant_move' },
    ]
  },

  // === ENDPOINTS ===
  end_resolved: {
    type: 'resolved',
    heading: "Issue resolved!",
    message: "If the issue returns, do these steps again."
  },

  end_electrician: {
    type: 'electrician',
    heading: "The outlet or circuit needs repair",
    message: "The outlet isn't providing power. Contact an electrician to fix the outlet or circuit."
  },
};

// --- Shared "contact support" endpoints ---
// These all render identically (same heading, same "Email Focal Support"
// card) and only differ in the issue `code` they report and whether they
// skip the heater QR/serial prompt (`noUnitPhoto`) — e.g. because the whole
// networking box was already identified, not one specific unit. Kept as
// one table + one END_SUPPORT node instead of ~8 near-identical TREE
// entries. `code` still drives real behavior elsewhere (buildEmailBody,
// render's requiresDescription/attachAsk checks), so it's preserved exactly
// per endpoint, just generated instead of hand-duplicated.
// `code` here is the detail portion only — no scope prefix. The scope
// segment (`All`, or a count like `1`/`3`) is prepended at send time by
// withScopeAndHeatState(), derived from how many heater QR/serial fields
// are actually populated (see populatedHeaterIds()). The two noUnitPhoto
// endpoints below never collect a count, so their code is scope-prefixed
// here directly: `networking`/`no_power` are inherently "all heaters"
// situations, and `generic` intentionally carries no scope segment at all.
const END_SUPPORT = {
  some_app: { code: 'noAppControl_reseatDidNotFix' },
  networking: { code: 'All_noAppControl_networkingDidNotFix', noUnitPhoto: true },
  pull_dead: { code: 'noPullControl_pullNoResponse' },
  pull_other: { code: 'pullOther' },
  pull_schedule: { code: 'noPullControl_pullScheduleDidNotFix' },
  rail_isolated: { code: 'isolatedUnit' },
  no_power: { code: 'All_noHeat_outletHasPower', noUnitPhoto: true },
  cant_move: { code: 'cantSlide' },
  generic: { code: 'generic', noUnitPhoto: true },
};

// Maps a heat_fallback caller's `fallbackKind` to the support endpoint it
// resolves to once answered. Only used by the heat_fallback node above.
const END_SUPPORT_TARGETS = {
  some_app: 'end_support_some_app',
  pull_dead: 'end_support_pull_dead',
  pull_other: 'end_support_pull_other',
  pull_schedule: 'end_support_pull_schedule',
  rail_isolated: 'end_support_rail_isolated',
};

for (const [key, def] of Object.entries(END_SUPPORT)) {
  TREE['end_support_' + key] = { type: 'support', heading: "Let's get you some help", ...def };
}

// Natural-language summaries keyed by nodeId -> optionIndex
const SUMMARIES = {
  start: {
    0: "Heaters offline or not responding.",
    1: "Heater won't slide on the rail.",
    2: "Heater is damaged.",
    3: "Something else is wrong.",
  },
  scope: {
    0: "All heaters are affected.",
    1: "Some heaters are affected.",
  },
  lights_check: {
    0: "The orange and purple LEDs are on.",
    1: "The orange and purple LEDs are not on.",
  },
  control_method: {
    0: "Trying to control it from the app or QR code.",
    1: "Trying to control it from the pull string.",
  },
  pull_string_check_some_app: {
    0: "Pulling the string on the affected heater(s) resolved the issue.",
    1: "Pulling the string on the affected heater(s) did not resolve the issue.",
  },
  networking: {
    0: "Checking the networking box fixed it.",
    1: "Still can't control the heaters after checking the networking box and router.",
  },
  pull_test: {
    0: "The yellow LEDs are flashing when pulling the string.",
    1: "The white LEDs changed when pulling the string.",
    2: "Nothing happened when pulling the string.",
    3: "Something unexpected happened when pulling the string, or unsure what happened.",
  },
  schedule_check_pull: {
    0: "Schedule Mode check resolved the issue.",
    1: "Schedule Mode is not the issue.",
  },
  reseat: {
    0: "Re-seating the heater restored the LEDs.",
    1: "Re-seating the heater did not restore the LEDs.",
  },
  check_rail: {
    0: "Other heaters on the same rail are on.",
    1: "Other heaters on the same rail are also dark.",
  },
  check_breaker: {
    0: "Checking the rail switch and breaker restored the LEDs.",
    1: "Checking the rail switch and breaker did not restore the LEDs.",
  },
  test_outlet: {
    0: "The outlet provides power when tested with another device.",
    1: "The outlet does not provide power.",
  },
  move_action: {
    0: "Full pull down let the heater slide on the rail.",
    1: "Full pull down did not let the heater slide on the rail.",
  },
  power_restored_control_check: {
    0: "Now that the LEDs are on, the heater can be controlled.",
    1: "The LEDs are on, but the heater still can't be controlled.",
  },
  heat_fallback: {
    0: "At least one control method (app/QR or pull string) still produces heat.",
    1: "The heater produces no heat at all right now.",
  },
  heat_fallback_cant_move: {
    0: "The heater still provides heat.",
    1: "The heater produces no heat at all right now.",
  },
};

// Short recap labels for the history list (question is already shown above it there)
const SHORT_ANSWERS = {
  lights_check: { 0: "Yes", 1: "No" },
  networking: { 0: "Yes", 1: "No" },
  reseat: { 0: "Yes", 1: "No" },
  check_breaker: { 0: "Yes", 1: "No" },
  power_restored_control_check: { 0: "Yes", 1: "No" },
  test_outlet: { 0: "Yes", 1: "No" },
  move_action: { 0: "Yes", 1: "No" },
  heat_fallback_cant_move: { 0: "Yes", 1: "No" },
};

// State
let path = []; // [{ nodeId, optionIndex }]
let issueDescription = '';
let heaterIds = ['']; // one input row per entry; empty rows are never sent or counted

// Only rows the customer actually typed/scanned something into count as
// "a heater was reported" — clicking "add another heater" and leaving it
// blank must not inflate the count or show up in the email.
function populatedHeaterIds() {
  return heaterIds.map(id => id.trim()).filter(id => id.length > 0);
}

// getScope() / getFallbackKind() recover a piece of context from earlier in
// the conversation by scanning `path` for the step that set it. This is how
// a later node's `next` function (see resolveNext) can branch on an answer
// given several questions ago without every intermediate node having to
// thread it through explicitly.

// Recovers the "all heaters" vs. "only some heaters" answer from the start
// of the "can't control" branch (see TREE.scope). Several later nodes
// (lights_check, control_method) route differently depending on this.
function getScope() {
  for (const step of path) {
    if (step.nodeId === 'scope' && step.optionIndex !== null) {
      return step.optionIndex === 0 ? 'all' : 'some';
    }
  }
  return null;
}

// Recovers which single-unit trouble path led into the shared heat_fallback
// checkpoint (see TREE.heat_fallback), so it knows which support endpoint
// to resolve to. Set via `fallbackKind` on the option that pointed here.
function getFallbackKind() {
  for (const step of path) {
    const node = TREE[step.nodeId];
    if (step.optionIndex === null || !node || !node.options) continue;
    const option = node.options[step.optionIndex];
    if (option && option.fallbackKind) return option.fallbackKind;
  }
  return null;
}

function resolveNext(option) {
  if (typeof option.next !== 'function') return option.next;
  return option.next({ scope: getScope(), fallbackKind: getFallbackKind() });
}

function getOptions(node) {
  return node.options;
}

function getSummary(nodeId, optionIndex) {
  if (SUMMARIES[nodeId] && SUMMARIES[nodeId][optionIndex] !== undefined) {
    return SUMMARIES[nodeId][optionIndex];
  }
  const node = TREE[nodeId];
  const options = node && getOptions(node);
  if (options && options[optionIndex]) {
    return options[optionIndex].label;
  }
  return '';
}

function getShortAnswer(nodeId, optionIndex) {
  if (SHORT_ANSWERS[nodeId] && SHORT_ANSWERS[nodeId][optionIndex] !== undefined) {
    return SHORT_ANSWERS[nodeId][optionIndex];
  }
  const node = TREE[nodeId];
  const options = node && getOptions(node);
  if (options && options[optionIndex]) {
    return options[optionIndex].label;
  }
  return '';
}

function currentNodeId() {
  if (path.length === 0) return 'start';
  const last = path[path.length - 1];
  const node = TREE[last.nodeId];
  if (last.optionIndex !== null && last.optionIndex !== undefined) {
    return resolveNext(getOptions(node)[last.optionIndex]);
  }
  return last.nodeId;
}

function selectOption(optionIndex) {
  const nodeId = currentNodeId();
  if (path.length > 0 && path[path.length - 1].optionIndex === null) {
    path[path.length - 1].optionIndex = optionIndex;
  } else {
    path.push({ nodeId, optionIndex });
  }
  const node = TREE[nodeId];
  const nextId = resolveNext(getOptions(node)[optionIndex]);
  const nextNode = TREE[nextId];
  if (!nextNode.type) {
    path.push({ nodeId: nextId, optionIndex: null });
  }
  render();
}

function goBack(stepIndex) {
  path = path.slice(0, stepIndex + 1);
  path[stepIndex].optionIndex = null;
  render();
}

function toggleResolvedHelp(link) {
  const card = link.closest('.endpoint').querySelector('.resolved-help');
  card.hidden = !card.hidden;
  if (!card.hidden) {
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function startOver() {
  path = [];
  issueDescription = '';
  heaterIds = [''];
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateIssueDescription(value, btnId, codeOverride) {
  issueDescription = value;
  refreshEmailHref(btnId, codeOverride);
}

function updateHeaterId(index, value) {
  heaterIds[index] = value;
  refreshEmailHref('email-btn');
}

function addHeaterRow() {
  heaterIds.push('');
  render();
}

// Removing a row always leaves at least one input on screen — dropping to
// zero rows would leave no way to enter a heater at all.
function removeHeaterRow(index) {
  heaterIds.splice(index, 1);
  if (heaterIds.length === 0) heaterIds.push('');
  render();
}

// Re-derives the mailto link (and, where the button can be disabled, whether
// it's allowed to send yet) whenever the user types into a description or
// heater-ID field. Shared by both endpoint types that show a live-updating
// email button: the required-field "support" endpoints (id="email-btn") and
// the optional-field "issue resolved, but..." follow-up card
// (id="resolved-email-btn"). `codeOverride` lets the latter keep stamping
// its email as a resolved-followup instead of a fresh support code.
function refreshEmailHref(btnId, codeOverride) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  const requiresDescription = btn.dataset.requiresDescription === 'true';
  const requiresHeaterId = btn.dataset.requiresHeaterId === 'true';
  const descriptionFilled = issueDescription.trim().length > 0;
  const heaterIdFilled = populatedHeaterIds().length > 0;
  const canSend = (!requiresDescription || descriptionFilled) && (!requiresHeaterId || heaterIdFilled);
  btn.classList.toggle('disabled', !canSend);
  btn.setAttribute('aria-disabled', String(!canSend));
  btn.onclick = canSend ? null : () => false;
  const subject = encodeURIComponent(buildSubject(codeOverride));
  const body = encodeURIComponent(buildEmailBody(codeOverride));
  btn.setAttribute('href', 'mailto:support@focalheat.co?subject=' + subject + '&body=' + body);
}

let barcodeDetectorPolyfillPromise = null;

// Safari and Firefox (desktop and iOS) never shipped the native BarcodeDetector
// API, so QR scanning silently failed there. Load a WASM (ZBar) polyfill that
// implements the same interface, only for browsers that need it.
function ensureBarcodeDetector() {
  if ('BarcodeDetector' in window) return Promise.resolve();
  if (!barcodeDetectorPolyfillPromise) {
    barcodeDetectorPolyfillPromise = import('https://cdn.jsdelivr.net/npm/@undecaf/barcode-detector-polyfill@0.9.23/dist/main.js')
      .then((module) => {
        window.BarcodeDetector = module.BarcodeDetectorPolyfill;
      });
  }
  return barcodeDetectorPolyfillPromise;
}

function openQrScanner(index) {
  const dialog = document.getElementById('qr-scanner-dialog');
  const video = document.getElementById('qr-scanner-video');
  const status = document.getElementById('qr-scanner-status');
  if (!dialog || !video) return;

  let stream = null;
  let stopped = false;

  dialog.onclose = closeQrScanner;

  status.textContent = 'Point the camera at the QR code.';
  dialog.showModal();

  ensureBarcodeDetector()
    .then(startScanning)
    .catch(() => {
      status.textContent = "Scanning isn't supported in this browser. Please type the code or serial number instead.";
    });

  function startScanning() {
    if (stopped) return;
    const detector = new BarcodeDetector({ formats: ['qr_code'] });

    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
      .catch(() => navigator.mediaDevices.getUserMedia({ video: true }))
      .then((s) => {
        if (stopped) {
          s.getTracks().forEach((track) => track.stop());
          return;
        }
        stream = s;
        video.srcObject = stream;
        return video.play();
      })
      .then(() => scanLoop(detector))
      .catch((err) => {
        const reason = err && err.name === 'NotAllowedError'
          ? 'Camera access was blocked. Allow camera access in your browser settings, or type the code or serial number instead.'
          : "Couldn't access the camera. Please type the code or serial number instead.";
        status.textContent = reason;
      });
  }

  function scanLoop(detector) {
    if (stopped) return;
    detector.detect(video).then((codes) => {
      if (stopped) return;
      if (codes.length > 0) {
        const value = codes[0].rawValue;
        const input = document.getElementById('heater-id-input-' + index);
        if (input) {
          input.value = value;
          updateHeaterId(index, value);
        }
        closeQrScanner();
        return;
      }
      requestAnimationFrame(() => scanLoop(detector));
    }).catch(() => {
      requestAnimationFrame(() => scanLoop(detector));
    });
  }

  function closeQrScanner() {
    stopped = true;
    if (stream) {
      stream.getTracks().forEach((track) => track.stop());
      stream = null;
    }
    video.srcObject = null;
    if (dialog.open) dialog.close();
  }
}

function currentEndNode() {
  if (path.length === 0) return null;
  const lastStep = path[path.length - 1];
  const lastNode = TREE[lastStep.nodeId];
  if (lastStep.optionIndex === null) return null;
  const endId = resolveNext(getOptions(lastNode)[lastStep.optionIndex]);
  return TREE[endId];
}

function currentEndOption() {
  if (path.length === 0) return null;
  const lastStep = path[path.length - 1];
  const lastNode = TREE[lastStep.nodeId];
  if (lastStep.optionIndex === null) return null;
  return getOptions(lastNode)[lastStep.optionIndex];
}

function wantsUnitPhoto() {
  const endNode = currentEndNode();
  const endOption = currentEndOption();
  if (endNode && endNode.noUnitPhoto) return false;
  if (endOption && endOption.resolvedNoUnitPhoto) return false;
  return true;
}

// Returns true if the heat_fallback checkpoint was answered "no heat at
// all" — false if it answered "yes, some way still works" or wasn't asked.
function isNoHeat() {
  for (let i = path.length - 1; i >= 0; i--) {
    const step = path[i];
    const isFallbackNode = step.nodeId === 'heat_fallback' || step.nodeId === 'heat_fallback_cant_move';
    if (isFallbackNode && step.optionIndex !== null) {
      return step.optionIndex === 1;
    }
  }
  return false;
}

// Issue codes are shaped {scope}_[noHeat_]{detail}, where scope is either
// `All` or a bare count of heaters reported (see populatedHeaterIds()).
// END_SUPPORT stores only the detail portion for per-unit endpoints (their
// scope depends on how many QR/serial fields got filled in, unknowable
// until send time) — `All_...` endpoints and `generic` already carry
// whatever scope prefix they need baked in, since neither has a count to
// derive, and are passed through unchanged.
function withScopeAndHeatState(code) {
  if (!code || code === 'generic' || code.startsWith('All_')) return code;
  const count = populatedHeaterIds().length || 1;
  const heatSegment = isNoHeat() ? 'noHeat_' : '';
  return count + '_' + heatSegment + code;
}

function buildEmailBody(codeOverride) {
  const endNode = currentEndNode();
  const code = codeOverride || (endNode && endNode.code ? withScopeAndHeatState(endNode.code) : null);
  let lines = [];
  if (endNode && endNode.code === 'damaged') {
    lines.push("Please attach a photo of the heater's damage before sending.", '');
  }
  lines.push('Issue description:', '');
  for (let i = 0; i < path.length; i++) {
    const step = path[i];
    if (step.optionIndex === null) continue;
    lines.push('- ' + getSummary(step.nodeId, step.optionIndex));
  }
  if (issueDescription.trim()) {
    lines.push('- ' + issueDescription.trim());
  }
  const ids = populatedHeaterIds();
  if (ids.length > 0) {
    lines.push('');
    lines.push(ids.length === 1 ? 'Heater QR/Serial: ' + ids[0] : 'Heater QR/Serials:');
    if (ids.length > 1) {
      for (const id of ids) lines.push('- ' + id);
    }
  }
  if (code) {
    lines.push('');
    lines.push('Issue code: ' + code);
  }
  return lines.join('\n');
}

function buildSubject(codeOverride) {
  const endNode = currentEndNode();
  const codeValue = codeOverride || (endNode && endNode.code ? withScopeAndHeatState(endNode.code) : null);
  const code = codeValue ? ' [' + codeValue + ']' : '';
  if (path.length > 0) {
    const first = path[0];
    const node = TREE[first.nodeId];
    if (first.optionIndex !== null) {
      return 'Troubleshooting: ' + getOptions(node)[first.optionIndex].label + code;
    }
  }
  return 'Troubleshooting help' + code;
}

function render() {
  const app = document.getElementById('app');
  let html = '';
  const hasHistory = path.length > 0 && (path[0].optionIndex !== null);

  // Render completed steps
  if (hasHistory) {
    html += '<div class="history">';
    for (let i = 0; i < path.length; i++) {
      const step = path[i];
      const node = TREE[step.nodeId];
      if (step.optionIndex === null) continue;
      const answer = getShortAnswer(step.nodeId, step.optionIndex);
      const qText = node.question || '';
      html += '<div class="history-step" onclick="goBack(' + i + ')">';
      html += '<div class="step-num">Step ' + (i + 1) + '</div>';
      html += '<div class="step-q">' + esc(qText) + '</div>';
      html += '<div class="step-a">' + esc(answer) + '</div>';
      html += '<div class="change-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></div>';
      html += '</div>';
    }
    html += '</div>';
  }

  // Current node
  const nodeId = currentNodeId();
  const node = TREE[nodeId];
  const wrapClass = hasHistory ? ' has-history' : '';

  if (node.type) {
    // Endpoint
    html += '<div class="endpoint fade-in' + wrapClass + '">';

    if (node.type === 'resolved') {
      const subject = encodeURIComponent(buildSubject('resolved_followup'));
      const body = encodeURIComponent(buildEmailBody('resolved_followup'));
      const mailtoHref = 'mailto:support@focalheat.co?subject=' + subject + '&amp;body=' + body;
      html += '<div class="endpoint-icon resolved">&#10003;</div>';
      html += '<h2>' + esc(node.heading) + '</h2>';
      html += '<p>' + esc(node.message) + '</p>';
      html += '<button class="start-over-btn" onclick="startOver()">Start over</button>';

      html += '<p class="another-link">Still need help? <a href="#" onclick="toggleResolvedHelp(this); return false;">Contact support</a>.</p>';
      html += '<div class="send-card resolved-help" hidden>';
      html += '<div class="textarea-label">Anything you want support to know? (optional)</div>';
      html += '<textarea class="issue-textarea" placeholder="e.g. it worked, but only for a few minutes" oninput="updateIssueDescription(this.value, \'resolved-email-btn\', \'resolved_followup\')">' + esc(issueDescription) + '</textarea>';
      html += '<ul class="send-reminders">';
      html += '<li>CC team members to keep them in the loop.</li>';
      html += '</ul>';
      html += '<a id="resolved-email-btn" class="email-btn" href="' + mailtoHref + '">';
      html += '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13L2 4"/></svg>';
      html += 'Email Focal Support</a>';
      html += '</div>';
    } else if (node.type === 'support') {
      const requiresDescription = node.code === 'generic' || node.code === 'pullOther';
      const requiresHeaterId = wantsUnitPhoto();
      const descriptionFilled = issueDescription.trim().length > 0;
      const heaterIdFilled = populatedHeaterIds().length > 0;
      const canSend = (!requiresDescription || descriptionFilled) && (!requiresHeaterId || heaterIdFilled);
      const subject = encodeURIComponent(buildSubject());
      const body = encodeURIComponent(buildEmailBody());
      const mailtoHref = 'mailto:support@focalheat.co?subject=' + subject + '&amp;body=' + body;
      const attachAsk = node.code === 'damaged'
        ? "Attach a photo of the heater's damage."
        : null;

      html += '<div class="endpoint-icon support">&#9993;</div>';
      html += '<h2>' + esc(node.heading) + '</h2>';

      if (requiresDescription) {
        html += '<div class="textarea-label">Describe what\'s going on</div>';
        html += '<textarea class="issue-textarea" placeholder="How can we help?" oninput="updateIssueDescription(this.value, \'email-btn\')">' + esc(issueDescription) + '</textarea>';
      }

      if (wantsUnitPhoto()) {
        const label = heaterIds.length > 1
          ? 'Scan each heater\'s QR code or copy/paste its serial number from the Focal Control app'
          : 'Scan the heater\'s QR code or copy/paste the serial number from the Focal Control app';
        html += '<div class="textarea-label">' + label + '</div>';
        for (let i = 0; i < heaterIds.length; i++) {
          html += '<div class="heater-id-row">';
          html += '<input type="text" id="heater-id-input-' + i + '" class="heater-id-input" placeholder="e.g. qr4.ch/12FG3 or DUO02-2607-VX1-00217" value="' + esc(heaterIds[i]) + '" oninput="updateHeaterId(' + i + ', this.value)">';
          html += '<button type="button" class="scan-qr-btn" onclick="openQrScanner(' + i + ')" title="Scan QR Code">';
          html += '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="14" y2="21"/><line x1="21" y1="14" x2="21" y2="21"/><line x1="14" y1="17.5" x2="21" y2="17.5"/></svg>';
          html += 'Scan QR</button>';
          if (heaterIds.length > 1) {
            html += '<button type="button" class="remove-heater-btn" onclick="removeHeaterRow(' + i + ')" title="Remove this heater" aria-label="Remove this heater">&times;</button>';
          }
          html += '</div>';
        }
        html += '<button type="button" class="add-heater-btn" onclick="addHeaterRow()">+ Add another heater</button>';
      }

      html += '<div class="send-plain">';
      html += '<ul class="send-reminders">';
      if (node.safetyStep) {
        html += '<li>' + esc(node.safetyStep) + '</li>';
      }
      if (attachAsk) {
        html += '<li>' + esc(attachAsk) + '</li>';
      }
      html += '<li>CC team members to keep them in the loop.</li>';
      html += '</ul>';
      const disabledClass = canSend ? '' : ' disabled';
      html += '<a id="email-btn" class="email-btn' + disabledClass + '" href="' + mailtoHref + '" data-requires-description="' + requiresDescription + '" data-requires-heater-id="' + requiresHeaterId + '" aria-disabled="' + !canSend + '" onclick="' + (canSend ? '' : 'return false;') + '">';
      html += '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13L2 4"/></svg>';
      html += 'Email Focal Support</a>';
      html += '</div>';
      html += '<p class="another-link">If needed, <a href="#" onclick="startOver(); return false;">report another issue after</a>.</p>';
    } else if (node.type === 'electrician') {
      html += '<div class="endpoint-icon support">&#9889;</div>';
      html += '<h2>' + esc(node.heading) + '</h2>';
      html += '<p>' + esc(node.message) + '</p>';
      html += '<button class="start-over-btn" onclick="startOver()">Start over</button>';
    }

    html += '</div>';

  } else {
    // Active question
    const stepNum = path.filter(s => s.optionIndex !== null).length + 1;
    html += '<div class="active-step fade-in' + wrapClass + '">';
    html += '<div class="step-num">Step ' + stepNum + '</div>';

    if (node.instruction) {
      html += '<div class="instruction">' + escBold(node.instruction);
      if (node.link) {
        html += '<br><a class="inst-link" href="' + node.link.url + '" target="_blank">';
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
        html += esc(node.link.label) + '</a>';
      }
      html += '</div>';
    }

    html += '<div class="question-text">' + esc(node.question) + '</div>';
    html += '<div class="options">';
    const options = getOptions(node);
    for (let i = 0; i < options.length; i++) {
      html += '<button class="opt-btn" onclick="selectOption(' + i + ')">' + esc(options[i].label) + '</button>';
    }
    html += '</div>';
    html += '</div>';
  }

  app.innerHTML = html;

  // Scroll to active step
  setTimeout(() => {
    const active = app.querySelector('.active-step, .endpoint');
    if (active) {
      active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }, 50);
}

function escBold(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Init
render();
</script>

</body>
</html>
