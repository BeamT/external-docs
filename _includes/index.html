---
layout: home
title: null
---
<section class="hero">
  <h1>Focal Guides</h1>
  <p>How to prepare for, install, and use Focal heaters.</p>
</section>

<div class="filter-row" role="group" aria-label="Filter by audience">
  <button class="chip" data-aud="electrician" aria-pressed="false">Electrician</button>
  <button class="chip" data-aud="installer" aria-pressed="false">Installer</button>
  <button class="chip" data-aud="customer" aria-pressed="false">Restaurant</button>
  <button class="chip" data-aud="all" aria-pressed="true">All</button>
</div>

<div class="card-list" id="card-list">
  {% assign guides = site.guides | sort: "order" %}
  {% for g in guides %}
  <a class="card" href="{{ g.url | prepend: site.baseurl }}"
     data-audience="{{ g.audience | join: ',' }}"
     data-order-default="{{ g.order }}"
     data-order-installer="{{ g.audience_order.installer | default: 999 }}"
     data-order-electrician="{{ g.audience_order.electrician | default: 999 }}"
     data-order-customer="{{ g.audience_order.customer | default: 999 }}"
     data-title="{{ g.title | downcase }}"
     data-summary="{{ g.summary | downcase }}"
     data-lead="{% if g.lead %}true{% else %}false{% endif %}">
    {% if g.lead %}<div class="lead-eyebrow">Start here</div>{% endif %}
    <h2>{{ g.title }}</h2>
    <p>{{ g.summary }}</p>
  </a>
  {% endfor %}
</div>
<p class="empty" id="empty" hidden>No guides match that.</p>

<script>
(function () {
  var list = document.getElementById('card-list');
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var chips = document.querySelectorAll('.chip');
  var search = document.getElementById('search');
  var empty = document.getElementById('empty');
  var aud = 'all';

  // Deep-link support: ?a=installer (used by the printed packet's QR and by
  // the /installer/, /electrician/, /restaurant/ share links) opens straight
  // to that audience's ordered view.
  var params = new URLSearchParams(window.location.search);
  var initial = params.get('a');
  if (initial && ['installer','electrician','customer'].indexOf(initial) !== -1) {
    aud = initial;
  }

  // Keep the address bar in sync with the visible filter, so copying the URL
  // out of the browser shares the filtered view rather than the full list.
  function syncUrl() {
    if (!window.history || !history.replaceState) return;
    history.replaceState(null, '',
      aud === 'all' ? window.location.pathname : window.location.pathname + '?a=' + aud);
  }

  function orderFor(card) {
    var key = aud === 'all' ? 'default' : aud;
    var dataKey = 'order' + key.charAt(0).toUpperCase() + key.slice(1);
    return parseInt(card.dataset[dataKey] || card.dataset.orderDefault, 10);
  }

  function apply() {
    var q = (search && search.value || '').trim().toLowerCase();

    var visible = cards.filter(function (c) {
      var okAud = aud === 'all' || c.dataset.audience.split(',').indexOf(aud) !== -1;
      var hay = c.dataset.title + ' ' + c.dataset.summary;
      var okQ = q.length < 2 || hay.indexOf(q) !== -1;
      c.style.display = (okAud && okQ) ? '' : 'none';
      return okAud && okQ;
    });

    visible.sort(function (a, b) { return orderFor(a) - orderFor(b); });
    visible.forEach(function (c) { list.appendChild(c); });

    // Promote the audience's entry-point guide to a lead card. Only in a
    // filtered, unsearched view, where "first" actually means "start here".
    cards.forEach(function (c) { c.classList.remove('card--lead'); });
    if (aud !== 'all' && q.length < 2 && visible.length &&
        visible[0].dataset.lead === 'true') {
      visible[0].classList.add('card--lead');
    }

    if (empty) empty.hidden = visible.length !== 0;
  }

  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      aud = chip.dataset.aud;
      chips.forEach(function (c) { c.setAttribute('aria-pressed', c === chip); });
      syncUrl();
      apply();
    });
  });
  // reflect any deep-linked audience in the pressed chip before first render
  chips.forEach(function (c) { c.setAttribute('aria-pressed', c.dataset.aud === aud); });
  if (search) search.addEventListener('input', apply);
  syncUrl();
  apply();
})();
</script>
