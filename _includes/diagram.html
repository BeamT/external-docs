<figure class="diagram{% if include.fill %} diagram-fill{% endif %}">
  <img src="{{ site.baseurl }}/assets/diagrams/{{ include.src }}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'diagram-missing',textContent:'Diagram coming soon'}))">
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
