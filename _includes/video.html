<figure class="video" id="{{ include.id | default: 'video' }}"><video controls preload="none" playsinline{% if include.poster %} poster="{{ site.baseurl }}/assets/video/{{ include.poster }}"{% endif %}><source src="{{ site.baseurl }}/assets/video/{{ include.src }}" type="video/mp4">{% if include.captions %}<track kind="captions" src="{{ site.baseurl }}/assets/video/{{ include.captions }}" srclang="en" label="English" default>{% endif %}<a href="{{ site.baseurl }}/assets/video/{{ include.src }}">Download the video</a></video>{% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}<div class="video-print">{% if include.qr %}<img src="{{ site.baseurl }}/assets/video/{{ include.qr }}" alt="">{% endif %}<span>Watch this step at {{ site.url }}{{ site.baseurl }}{{ page.url }}#{{ include.id | default: 'video' }}</span></div></figure>
