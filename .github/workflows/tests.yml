name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Build the site with the Jekyll version pinned in Gemfile.lock, since
      # tests/search.spec.js reads the generated _site/search.json.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --baseurl "" --config _config.yml,tests/product-off.yml
      # Second build with the Product choice setting on, for
      # tests/product-choice.spec.js.
      - name: Build site with Product choice on
        run: bundle exec jekyll build --baseurl "" --config _config.yml,tests/product-choice.yml -d _site_choice

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
