name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Build the site with the same Jekyll major version GitHub Pages uses,
      # since tests/search.spec.js reads the generated _site/search.json.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Jekyll
        run: gem install --no-document jekyll:3.10.0 kramdown-parser-gfm
      - name: Build site
        run: jekyll build --baseurl ""

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
