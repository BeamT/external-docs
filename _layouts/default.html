<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <script>window.__baseurl = "{{ site.baseurl }}";</script>
  
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/style.css?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="{{ site.baseurl }}/" class="brand" aria-label="Focal">
        <img src="{{ site.baseurl }}/assets/wordmark.png" alt="Focal" height="24" style="height:24px;width:auto;display:block"
             onerror="this.style.display='none';this.insertAdjacentHTML('afterend','Focal<span class=&quot;dot&quot;>.</span>')">
      </a>
      {% if page.layout == 'home' %}
      <div class="searchbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="search" placeholder="Search the guides…" aria-label="Search documentation">
      </div>
      {% endif %}
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
</body>
</html>
