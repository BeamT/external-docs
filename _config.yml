title: Focal Support
description: Installation and usage guides for Focal patio heaters.

# Used by the print fallback in _includes/video.html to build an absolute link.
# Update this alongside baseurl if you move to a custom domain.
url: "https://support.focalheat.co"

# GitHub Pages serves from a subpath like /repo-name/. This is set to your
# repo name. If you rename the repo or use a custom domain, update this.
baseurl: "/"

collections:
  guides:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: guides
    values:
      layout: guide

# Only what GitHub Pages' Jekyll needs.
markdown: kramdown

# Dev files that shouldn't be published. Setting this replaces Jekyll's own
# default list on GitHub Pages (Jekyll 3), so those defaults are repeated here.
exclude:
  - README.md
  - package.json
  - package-lock.json
  - playwright.config.js
  - tests/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - .sass-cache/
  - .jekyll-cache/
