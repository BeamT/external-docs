title: Focal Support
description: Installation and usage guides for Focal patio heaters.

# Used by the print fallback in _includes/video.html to build an absolute link.
# Update this alongside baseurl if you move to a custom domain.
url: "https://support.focalheat.co"

# GitHub Pages serves from a subpath like /repo-name/. This is set to your
# repo name. If you rename the repo or use a custom domain, update this.
baseurl: "/"

# Product choice (Restaurant / Home). Off: the site is Restaurant only, with no
# Home tab and no first-visit choice. The launch ticket under #136 turns it on.
product_choice: false

# Home Product setting. Off, the site is Restaurant only: Guides show no Product
# tag or note, and Home-only content stays hidden. The Product choice ticket
# (#154) builds on this flag; the launch ticket (#172) turns it on.
home_enabled: false

collections:
  guides:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: guides
    values:
      layout: guide

# Only what GitHub Pages' Jekyll needs.
markdown: kramdown

# Dev files that shouldn't be published. Setting this replaces Jekyll's own
# default list on GitHub Pages (Jekyll 3), so those defaults are repeated here.
exclude:
  - README.md
  - GLOSSARY.md
  - package.json
  - package-lock.json
  - playwright.config.js
  - tests/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - .sass-cache/
  - .jekyll-cache/
